name: Deploy Pages

# Deploys the static site (repo root) to GitHub Pages.
# Requires: Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# A new deploy CANCELS any in-progress or queued one, instead of piling up
# behind it — so a stuck deployment can never block future ones again.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Split build/deploy (the canonical Pages layout) so that re-running the
  # deploy job never re-uploads the artifact — which would otherwise leave two
  # artifacts named "github-pages" and fail with "Multiple artifacts ... found".
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # the whole repo root is the site (static HTML)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
